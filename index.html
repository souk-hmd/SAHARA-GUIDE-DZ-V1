<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#081116">
<meta name="description" content="SAHARA GUIDE DZ — منصة الملاحة والخدمات والسلامة في الصحراء الجزائرية">
<link rel="manifest" href="./manifest.json">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="./style.css">
<title>SAHARA GUIDE DZ</title>
</head>
<body>
<div id="map"></div>

<header class="topbar">
  <div class="brand glass">
    <div class="logo">🏜️ <b>SAHARA GUIDE <span>DZ</span></b></div>
    <small>منصة الصحراء الجزائرية</small>
  </div>
  <button id="gpsStatus" class="status glass">● GPS OFF</button>
</header>

<div class="search glass">
  <span>⌕</span>
  <input id="searchInput" placeholder="ابحث عن مدينة، بئر، طريق أو مكان..." autocomplete="off">
  <button id="searchBtn">بحث</button>
</div>

<div class="map-tools">
  <button data-layer="standard" class="active">🗺️</button>
  <button data-layer="satellite">🛰️</button>
  <button data-layer="terrain">⛰️</button>
  <button id="locateBtn">📍</button>
</div>

<div class="quick glass">
  <button data-open="water">💧<small>المياه</small></button>
  <button data-open="places">🏜️<small>الأماكن</small></button>
  <button data-open="trips">🚙<small>الرحلات</small></button>
  <button data-open="community">👥<small>المجتمع</small></button>
  <button data-open="support">💛<small>ادعمنا</small></button>
</div>

<div id="destination" class="destination glass hidden">
  <div><small>الوجهة</small><b id="destName">—</b></div>
  <div><b id="destDistance">—</b><small>المسافة</small></div>
  <div><b id="destBearing">—</b><small>الاتجاه</small></div>
  <button id="clearDest">×</button>
</div>

<section class="bottom glass">
  <div class="handle"></div>
  <div class="stats">
    <div><b id="distance">0.00</b><small>كم الرحلة</small></div>
    <div><b id="speed">0.0</b><small>كم/س</small></div>
    <div><b id="accuracy">—</b><small>دقة GPS</small></div>
    <div><b id="altitude">—</b><small>الارتفاع</small></div>
  </div>
  <div class="coords" id="coords">📍 في انتظار تحديد الموقع...</div>
  <div class="main-actions">
    <button id="trackBtn" class="primary">▶️ ابدأ الرحلة</button>
    <button id="sosBtn" class="danger">🆘 SOS</button>
  </div>
  <div class="nav-row">
    <button data-open="water">💧 المياه</button>
    <button data-open="places">🏜️ الأماكن</button>
    <button data-open="points">📌 نقاطي</button>
    <button data-open="settings">⚙️</button>
  </div>
</section>

<div id="toast" class="toast"></div>

<div id="sheet" class="sheet">
  <div class="sheet-card glass">
    <div class="sheet-head"><h2 id="sheetTitle">—</h2><button id="closeSheet">×</button></div>
    <div id="sheetBody"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="./app.js"></script>
</body>
</html>
