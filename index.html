<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b1220"><meta name="description" content="SAHARA GUIDE DZ V2 - دليل الصحراء الجزائري">
<link rel="manifest" href="manifest.json"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="style.css">
<title>SAHARA GUIDE DZ V2</title></head>
<body>
<header><div class="brand">🏜️ SAHARA GUIDE DZ <small>V2</small></div><button id="locateBtn">📍</button></header>
<section class="searchbar"><input id="search" placeholder="🔎 ابحث عن مكان أو طريق..."><button id="searchBtn">بحث</button></section>
<div class="layers"><button class="layer active" data-layer="map">🗺️ Map</button><button class="layer" data-layer="sat">🛰️ Satellite</button></div>
<main><div id="map"></div></main>
<div class="status"><span id="gpsStatus">📍 GPS: في انتظار الإذن</span><span id="coords">—</span></div>
<section class="tools"><button id="compass">🧭<b>البوصلة</b></button><button id="distance">📏<b>المسافة</b></button><button id="trip">🚙<b>الرحلة</b></button><button id="water">💧<b>المياه</b></button><button id="danger">⚠️<b>المخاطر</b></button><button id="places">🏜️<b>الأماكن</b></button><button id="savePoint">📌<b>حفظ نقطة</b></button><button id="sos">🚨<b>SOS</b></button></section>
<div id="panel" class="panel hidden"></div><footer>© OpenStreetMap contributors · Satellite: Esri · SAHARA GUIDE DZ V2</footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="app.js"></script></body></html>
